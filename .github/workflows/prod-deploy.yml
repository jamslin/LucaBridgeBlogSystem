# Deploy PROD to AKS — AUTOMATIC on push to main.
name: Deploy PROD to AKS

on:
  push:
    branches:
      - main  # 當您推送到 main 分支時，自動啟動

permissions:
  contents: read
  id-token: write

concurrency:
  group: lucabridge-prod
  cancel-in-progress: false

env:
  ACR_NAME: lucabridgeacr
  ACR_SERVER: lucabridgeacr.azurecr.io
  RESOURCE_GROUP: rg-lucabridge
  AKS_CLUSTER: aks-lucabridge
  NAMESPACE: lucabridge  # <--- 修正為生產環境空間

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest
    environment: uat  # <--- 保持 uat 以維持 Entra OIDC 聯邦憑證權限，不影響部署空間

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # 1. Rebuild 最新程式碼並推至 ACR
      - name: Build and push backend
        run: |
          docker build \
            --tag "$ACR_SERVER/lucabridge-backend:${GITHUB_SHA}" \
            backend
          docker push "$ACR_SERVER/lucabridge-backend:${GITHUB_SHA}"

      - name: Build and push frontend
        run: |
          docker build \
            --tag "$ACR_SERVER/lucabridge-frontend:${GITHUB_SHA}" \
            frontend
          docker push "$ACR_SERVER/lucabridge-frontend:${GITHUB_SHA}"

      # 2. 連線至 AKS 集群
      - name: Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: true

      # 3. 更新生產環境（不更動 Postgres、MinIO，只更新應用程式映像檔）
      - name: Deploy and Host on Prod (Rolling Update)
        run: |
          kubectl set image deployment/backend -n "$NAMESPACE" backend="$ACR_SERVER/lucabridge-backend:${GITHUB_SHA}"
          kubectl set image deployment/frontend -n "$NAMESPACE" frontend="$ACR_SERVER/lucabridge-frontend:${GITHUB_SHA}"

      # 4. 確保生產環境成功運行
      - name: Verify Prod Rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s
