name: Production Auto Deploy

on:
  push:
    branches:
      - main  # 偵測到 main 分支有新 push 時自動啟動

jobs:
  deploy-to-prod:
    runs-on: ubuntu-latest
    steps:
    
    # 1. 拉取 GitHub 上的最新程式碼
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 登入 Azure 帳戶 (需要填寫您在 GitHub 設定的 Secret)
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 3. 登入您的 Azure Container Registry
    - name: Login to ACR
      run: |
        az acr login --name lucabridgeacr

    # 4. Rebuild 前端並推送到 ACR (自動帶入最新 Commit Hash)
    - name: Rebuild and Push Frontend
      run: |
        docker build -t lucabridgeacr.azurecr.io/lucabridge-frontend:${{ github.sha }} ./frontend
        docker push lucabridgeacr.azurecr.io/lucabridge-frontend:${{ github.sha }}

    # 5. Rebuild 後端並推送到 ACR
    - name: Rebuild and Push Backend
      run: |
        docker build -t lucabridgeacr.azurecr.io/lucabridge-backend:${{ github.sha }} ./backend
        docker push lucabridgeacr.azurecr.io/lucabridge-backend:${{ github.sha }}

    # 6. 連線到您的 AKS 集群
    - name: Connect to AKS
      uses: azure/aks-set-context@v4
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        cluster-name: '您的AKS集群名稱'        # <--- 請改為您真實的 AKS 名稱
        resource-group: '您的Azure資源群組名稱' # <--- 請改為您真實的 Resource Group 名稱

    # 7. 發布到 K8s 生產環境 (lucabridge 空間)
    - name: Host on K8s Prod
      run: |
        kubectl set image deployment/frontend -n lucabridge frontend=lucabridgeacr.azurecr.io/lucabridge-frontend:${{ github.sha }}
        kubectl set image deployment/backend -n lucabridge backend=lucabridgeacr.azurecr.io/lucabridge-backend:${{ github.sha }}
