# Deploy UAT to AKS — MANUAL ONLY since 2026-08-29.
#
# The automatic `push: branches: [main]` trigger was removed. Reasons:
#   1. UAT was merged into prod and its workloads are scaled to 0, so every push
#      failed at the rollout/smoke-test steps.
#   2. There is now only ONE environment, and it is the one the client looks at.
#      An automatic push-to-deploy into that is a bigger risk than a manual click.
#
# Run it from GitHub -> Actions -> "Deploy UAT to AKS" -> Run workflow.
# The build + push steps still work and still tag images with the full commit SHA,
# so this remains the supported way to produce an image for prod.
#
# To promote an image built here into prod:
#   kubectl -n lucabridge set image deployment/backend  backend=lucabridgeacr.azurecr.io/lucabridge-backend:<SHA>
#   kubectl -n lucabridge set image deployment/frontend frontend=lucabridgeacr.azurecr.io/lucabridge-frontend:<SHA>
#
# DO NOT change `environment: uat` below. The Entra federated credential subject is
# pinned to `repo:jamslin/LucaBridgeBlogSystem:environment:uat`; renaming it breaks OIDC.
#
# Before re-enabling the push trigger, un-park UAT first (see k8s-aks/uat/uat.yaml)
# and check the cluster still fits — prod alone sits at ~1462m of 1900m on one node.
name: Deploy UAT to AKS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lucabridge-uat
  cancel-in-progress: false

env:
  ACR_NAME: lucabridgeacr
  ACR_SERVER: lucabridgeacr.azurecr.io
  RESOURCE_GROUP: rg-lucabridge
  AKS_CLUSTER: aks-lucabridge
  NAMESPACE: lucabridge-uat
  UAT_ORIGIN: http://uat.20.187.173.180.nip.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push backend
        run: |
          docker build \
            --tag "$ACR_SERVER/lucabridge-backend:${GITHUB_SHA}" \
            backend
          docker push "$ACR_SERVER/lucabridge-backend:${GITHUB_SHA}"

      - name: Build and push frontend
        run: |
          docker build \
            --tag "$ACR_SERVER/lucabridge-frontend:${GITHUB_SHA}" \
            frontend
          docker push "$ACR_SERVER/lucabridge-frontend:${GITHUB_SHA}"

      - name: Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: true

      - name: Create the UAT-specific seed
        run: |
          sed "s#http://localhost:9000#${UAT_ORIGIN}#g" \
            backend/src/main/resources/data.sql > /tmp/uat-data.sql
          kubectl -n "$NAMESPACE" create configmap uat-seed \
            --from-file=data.sql=/tmp/uat-data.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to UAT
        uses: Azure/k8s-deploy@v5
        with:
          namespace: ${{ env.NAMESPACE }}
          manifests: k8s-aks/uat/uat.yaml
          images: |
            ${{ env.ACR_SERVER }}/lucabridge-backend:${{ github.sha }}
            ${{ env.ACR_SERVER }}/lucabridge-frontend:${{ github.sha }}
          strategy: basic

      - name: Verify UAT
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 \
            "$UAT_ORIGIN/zh-Hant" > /dev/null
