# React Router v7 SSR frontend (Node server, port 3000).
# Mirrors the `frontend` service in docker-compose.yml.
# API_URL points at the in-cluster backend Service (server-side SSR fetches).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: lucabridge
data:
  API_URL: "http://backend:8080"
  # Real prod origin. Was "https://lucabridge.example.org" (placeholder) until 2026-08-20 —
  # that made SSR emit wrong canonical/OG URLs on every page.
  SITE_ORIGIN: "https://lucabridge.org.hk"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lucabridge
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lucabridge
spec:
  # 1, not 2. On a single Standard_B2s_v2 (2 vCPU, ~1.9 allocatable, ~0.85 eaten by
  # kube-system + app-routing nginx) a second SSR replica buys nothing and is enough to
  # push the cluster autoscaler to a second node — that was 76% of the 2026-08-20 cost
  # overrun. Raise this only after moving to a bigger node SKU.
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # TAG IS A PLACEHOLDER. Live prod runs a COMMIT-SHA tag, not :latest
          # (2026-08-29: b4e5e008cdc87ebe92841e9b105ad63c5b36c1ad). The GitHub Actions
          # workflow overrides it via `Azure/k8s-deploy` images:, and manual promotion
          # uses `kubectl set image`. A SHA frozen here would be stale within a day, so
          # this file is deliberately NOT the source of truth for which build is running.
          # Ask the cluster instead:
          #   kubectl -n lucabridge get deploy -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[*].image}{"\n"}{end}'
          image: lucabridgeacr.azurecr.io/lucabridge-frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              memory: "512Mi"
