# cert-manager ClusterIssuers for LucaBridge (Let's Encrypt via HTTP-01).
#
# Prereq — install cert-manager once:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   kubectl -n cert-manager rollout status deploy/cert-manager-webhook
#
# Then:
#   kubectl apply -f 60-cluster-issuer.yaml
#
# CHANGED 2026-08-29 — ingressClassName was `webapprouting.kubernetes.azure.com` until the
# AKS app-routing add-on was removed. That value was a SILENT TIME BOMB: the current cert is
# valid to 2026-11-20 and cert-manager starts renewing ~30 days out, so the stale class would
# not have failed until mid-October, when the HTTP-01 solver would have created a challenge
# Ingress that no controller watches. The challenge stays Pending, renewal never completes,
# and the certificate simply expires. Nothing alerts on this.
#
# Check renewal health with:
#   kubectl get certificate,certificaterequest,order,challenge -A
#
# HTTP-01 solves the challenge through the self-managed ingress-nginx (class `nginx`), so
# the lucabridge.org.hk A record must already resolve to the ingress IP (20.187.173.180)
# before a cert can issue or renew. Test with letsencrypt-staging first (no rate limits);
# once the staging cert appears, switch the ingress annotation to letsencrypt-prod.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: jamslin89@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jamslin89@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
