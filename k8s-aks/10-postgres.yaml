# PostgreSQL 16 — StatefulSet (stable identity + persistent volume).
# Mirrors the `postgres` service in docker-compose.yml.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: lucabridge
type: Opaque
stringData:
  # CHANGE THIS before applying (or create the secret with `kubectl create secret` instead).
  POSTGRES_PASSWORD: "change-me-strong-password"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lucabridge
  labels:
    app: postgres
spec:
  # Headless service — required for a StatefulSet's stable DNS (postgres-0.postgres...).
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lucabridge
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lucabridge
            - name: POSTGRES_USER
              value: lucabridge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Keep PGDATA in a subdir so the volume root stays clean.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lucabridge", "-d", "lucabridge"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lucabridge", "-d", "lucabridge"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # AKS managed disk (StandardSSD, CSI). "default" or "managed-csi" both work.
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
