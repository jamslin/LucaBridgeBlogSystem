# Spring Boot 3 backend (Java 21).
# Mirrors the `backend` service in docker-compose.yml. Image comes from your registry
# (GHCR) — built by CI, not `build:` like compose.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: lucabridge
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "postgres"
  STORAGE_ENDPOINT: "http://minio:9000"
  # Public URL the browser uses to fetch images. Must be browser-reachable, NOT the
  # in-cluster address — http://minio:9000 resolves only inside the cluster, so every
  # stored image 404s in a browser. Requires a /blog-media route on the ingress
  # (the UAT manifest already has one; prod's 50-ingress.yaml does not yet).
  STORAGE_PUBLIC_BASE_URL: "https://lucabridge.org.hk"
  # Real prod origin. Was "https://lucabridge.example.org" (placeholder) until 2026-08-20 —
  # that meant every admin-CMS call from the real domain was blocked by CORS.
  CORS_ORIGINS: "https://lucabridge.org.hk"
---
# !! DO NOT UNCOMMENT AND APPLY !!
# The live backend-secret was created imperatively on 2026-08-06 with a real JWT secret
# and a real bcrypt admin hash (`kubectl create secret generic backend-secret ...`).
# Applying the placeholder below would overwrite them and lock every admin out of the CMS.
# It is kept here only to document the required keys.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: backend-secret
#   namespace: lucabridge
# type: Opaque
# stringData:
#   JWT_SECRET: "<strong random string — prod fails fast if blank>"
#   APP_ADMIN_PASSWORD_HASH: "<bcrypt hash of the admin password>"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lucabridge
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lucabridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # TAG IS A PLACEHOLDER. Live prod runs a COMMIT-SHA tag, not :latest
          # (2026-08-29: b4e5e008cdc87ebe92841e9b105ad63c5b36c1ad). The GitHub Actions
          # workflow overrides it via `Azure/k8s-deploy` images:, and manual promotion
          # uses `kubectl set image`. A SHA frozen here would be stale within a day, so
          # this file is deliberately NOT the source of truth for which build is running.
          # Ask the cluster instead:
          #   kubectl -n lucabridge get deploy -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.template.spec.containers[*].image}{"\n"}{end}'
          image: lucabridgeacr.azurecr.io/lucabridge-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
