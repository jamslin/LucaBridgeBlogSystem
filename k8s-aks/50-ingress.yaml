# AKS managed-nginx Ingress (app routing add-on; ingressClass webapprouting.kubernetes.azure.com).
# Routing mirrors infra/nginx: /api + /actuator -> backend, everything else -> SSR frontend.
#
# Host-bound to lucabridge.org.hk with TLS via cert-manager (Let's Encrypt).
#   A record: lucabridge.org.hk -> ingress public IP (kubectl get ingress -n lucabridge -> ADDRESS)
# NOTE: now that a host is set, the bare-IP URL no longer matches this rule (expected for prod).
# cert-manager must be installed and 60-cluster-issuer.yaml applied first; the A record must
# already resolve, because the HTTP-01 challenge is served over port 80 on this host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lucabridge
  namespace: lucabridge
  annotations:
    # Start with letsencrypt-staging to test, then switch to letsencrypt-prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - lucabridge.org.hk
      secretName: lucabridge-tls
  rules:
    - host: lucabridge.org.hk
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
