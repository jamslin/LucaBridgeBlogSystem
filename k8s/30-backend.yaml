# Spring Boot 3 backend (Java 21).
# Mirrors the `backend` service in docker-compose.yml. Image comes from your registry
# (GHCR) — built by CI, not `build:` like compose.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: lucabridge
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "postgres"
  STORAGE_ENDPOINT: "http://minio:9000"
  # Public URL the browser uses to fetch images — set to your real domain/path in prod.
  STORAGE_PUBLIC_BASE_URL: "http://minio:9000"
  CORS_ORIGINS: "https://lucabridge.example.org"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: lucabridge
type: Opaque
stringData:
  # JWT_SECRET must be a strong random string (prod fails fast if blank).
  JWT_SECRET: "change-me-long-random-jwt-secret"
  # BCrypt hash of the admin password (generate with your backend's hash util).
  APP_ADMIN_PASSWORD_HASH: "change-me-bcrypt-hash"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lucabridge
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lucabridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # MinIO starts with no buckets and the backend never creates one, so a
      # fresh cluster (or a rebuilt MinIO PVC) fails every upload with S3 404
      # NoSuchBucket. This runs before the app on every rollout — both commands
      # are idempotent, so it is a no-op once the bucket exists.
      #
      # `anonymous set download` is required, not cosmetic: media URLs are plain
      # public links and the upload path sets no per-object ACL, so on a private
      # bucket images 403 in the browser even though the upload succeeded.
      initContainers:
        - name: ensure-media-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: BUCKET
              value: "blog-media"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing "local/$BUCKET"
              mc anonymous set download "local/$BUCKET"
              echo "bucket $BUCKET ready"
      containers:
        - name: backend
          # CHANGE to your GHCR path + tag (CI pushes this).
          image: ghcr.io/YOUR_GH_USER/lucabridge-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
