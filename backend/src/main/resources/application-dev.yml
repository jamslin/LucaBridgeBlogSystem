# Dev overrides.
#
# Flyway now runs in dev exactly as it does in prod, and Hibernate only validates.
# The previous setup (ddl-auto: create-drop plus a data.sql seed) is gone on purpose:
# it rebuilt the schema on every start, which raced a rolling update and wiped the
# UAT database, and its seed once overwrote the real admin row in prod.
#
# Content comes from a dump/restore, never from a file in the repo. Migrations carry
# schema and closed-list reference data only.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
logging:
  level:
    com.lucabridge.core: DEBUG
