spring:
  application:
    name: lucabridge
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lucabridge}
    username: ${DB_USER:lucabridge}
    password: ${DB_PASSWORD:lucabridge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Schema and closed-list reference data only. Content never lives in a migration —
    # it arrives by dump/restore. Every environment, dev included, runs these.
    locations: classpath:db/migration
    # No baseline: the v2 schema starts from an empty database. If Flyway ever reports
    # "found non-empty schema without history", that means it is pointed at the old
    # database - drop it rather than baselining over a schema that no longer matches.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    # BCrypt hash of the admin password — generate with e.g. `htpasswd -bnBC 10 "" 'yourpassword' | tr -d ':\n'`
    # or any BCrypt generator. Leave unset to disable admin login (public read API still works).
    # On first start this hash seeds the bootstrap admin row in app_user (see AdminUserInitializer).
    password-hash: ${APP_ADMIN_PASSWORD_HASH:}
  jwt:
    # Prod fails fast at startup if this is left at the default (see JwtSecretValidator).
    secret: ${JWT_SECRET:change-me-in-prod-this-should-be-a-long-random-string}
    expiration-minutes: 720
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  i18n:
    # Internal tokens. The BCP-47 tags (zh-Hant / zh-Hans / en) are derived from these
    # by Lang and are the only form allowed to reach a browser or a crawler.
    default-lang: tc
    supported-langs: tc,en,sc
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:blog-media}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    region: us-east-1

logging:
  level:
    com.lucabridge.core: INFO
